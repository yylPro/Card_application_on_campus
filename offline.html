<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>线下实名核验 · 校园通信服务</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="offline-page">
    <header class="offline-header">
      <a class="brand" href="/offline"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>线下实名核验</span></a>
      <span id="offlineAccount">正在验证实体端身份...</span>
      <button class="text-button" id="offlineLogoutButton" type="button">退出</button>
    </header>
    <main class="offline-main">
      <section class="offline-heading">
        <p class="eyebrow">线下实体端</p>
        <h1>实名验证消息导入</h1>
        <p>无论单条登记还是批量导入，系统只激活特征码和完整身份证号码均与选号订单一致的记录。</p>
      </section>
      <section class="offline-manual">
        <div><h2>登记单条实名结果</h2><p>工作人员核对学生本人和身份证原件后，录入学生出示的特征码。</p></div>
        <form id="offlineManualForm">
          <div class="form-row"><label>学生特征码<input name="featureCode" maxlength="40" autocomplete="off" required placeholder="请输入特征码" /></label><label>身份证号码<input name="idCard" maxlength="18" pattern="[0-9]{17}[0-9Xx]" autocomplete="off" required placeholder="请输入完整身份证号" /></label></div>
          <label>实名验证消息/流水号（可选）<input name="reference" maxlength="200" placeholder="例如：现场核验流水号" /></label>
          <button class="primary-button" type="submit">匹配学生与选号号码</button>
        </form>
      </section>
      <section class="offline-match" id="offlineMatch" hidden aria-live="polite">
        <div><p class="eyebrow">匹配成功</p><h2>请工作人员核对后确认激活</h2></div>
        <div class="offline-match-detail" id="offlineMatchDetail"></div>
        <div class="offline-match-actions"><button class="outline-button" id="cancelOfflineMatch" type="button">返回重填</button><button class="primary-button" id="confirmOfflineActivation" type="button">确认实名并激活</button></div>
      </section>
      <section class="offline-import">
        <div>
          <h2>批量导入验证结果</h2>
          <p>首行必须包含“特征码”和“身份证号码”；可附加“实名验证消息”或“验证流水号”。</p>
        </div>
        <form id="offlineImportForm">
          <label>实名验证 Excel<input type="file" name="verificationFile" accept=".xlsx,.xls,.csv" required /></label>
          <button class="primary-button" type="submit">导入并匹配激活</button>
        </form>
      </section>
      <section class="offline-result" id="offlineResult" hidden aria-live="polite"></section>
    </main>
    <div class="toast" id="toast" role="status"></div>
    <script src="/offline.js"></script>
  </body>
</html>
