<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>线下实名核验 · 校园通信服务</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="offline-page">
    <header class="offline-header">
      <a class="brand" href="/offline"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>线下实名核验</span></a>
      <span id="offlineAccount">正在验证实体端身份...</span>
      <button class="text-button" id="offlineLogoutButton" type="button">退出</button>
    </header>
    <main class="offline-main">
      <section class="offline-heading">
        <p class="eyebrow">线下实体端</p>
        <h1>实名核验</h1>
        <p>扫描学生预约二维码，填写校园号码并上传套卡实名已激活页面。</p>
      </section>
      <section class="offline-manual">
        <div><h2>核验学生预约</h2><p>请使用学生订单二维码完成核验。</p></div>
        <form id="offlineManualForm">
          <label>学生订单核验码<input name="featureCode" maxlength="40" autocomplete="off" required placeholder="扫码后自动填入，也可手工输入" /><button class="outline-button" id="scanQrButton" type="button">扫描学生二维码</button></label>
          <label>校园号码<input name="campusNumber" maxlength="80" autocomplete="off" required placeholder="请输入校园号码" /></label>
          <label>套卡实名已激活页面<input name="activationProofFile" type="file" accept="image/*,.pdf" required /></label>
          <button class="primary-button" type="submit">提交实名核验</button>
        </form>
      </section>
      <section class="offline-scanner" id="offlineScanner" hidden role="dialog" aria-modal="true"><div class="offline-scanner-head"><h2>扫描学生预约二维码</h2><button class="text-button" id="stopScanButton" type="button">关闭</button></div><p>请允许浏览器使用摄像头，将学生出示的订单二维码放入取景框。</p><video id="qrVideo" playsinline></video></section>
      <section class="offline-match" id="offlineMatch" hidden aria-live="polite">
        <div><p class="eyebrow">匹配成功</p><h2>请工作人员核对后提交实名结果</h2></div>
        <div class="offline-match-detail" id="offlineMatchDetail"></div>
        <div class="offline-match-actions"><button class="outline-button" id="cancelOfflineMatch" type="button">返回重填</button><button class="primary-button" id="confirmOfflineActivation" type="button">提交实名核验</button></div>
      </section>
      <section class="offline-result" id="offlineResult" hidden aria-live="polite"></section>
    </main>
    <div class="toast" id="toast" role="status"></div>
    <script src="/vendor/jsqr.js"></script>
    <script src="/offline.js"></script>
  </body>
</html>
