<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b6cb7" />
    <title>校园通信服务</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="student-page">
    <header class="student-header">
      <a class="brand" href="/" aria-label="校园通信服务首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>校园通信服务</span>
      </a>
      <span class="school-badge" id="schoolBadge">正在识别学校...</span>
      <a class="header-help" href="tel:10086">客服 10086</a>
    </header>

    <main class="student-main">
      <section class="quick-actions" aria-label="常用操作">
        <button type="button" data-open="校园账号预约" data-kind="order">
          <span class="action-icon">号</span>
          <span><strong>校园账号预约</strong><small>线下实名核验</small></span>
        </button>
        <button type="button" data-open="查询服务进度" data-kind="lookup">
          <span class="action-icon">网</span>
          <span><strong>查询订单</strong><small>查看特征码和办理状态</small></span>
        </button>
        <button type="button" id="staffEntryButton">
          <span class="action-icon">端</span>
          <span><strong>工作人员入口</strong><small>运营商、线下、商家</small></span>
        </button>
      </section>

    </main>

    <div class="modal-backdrop" id="serviceModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="icon-close" type="button" data-close aria-label="关闭">×</button>
        <p class="eyebrow" id="modalSchool">校园通信服务</p>
        <h2 id="modalTitle">提交服务预约</h2>
        <p class="modal-intro" id="modalIntro">提交后，工作人员会与您确认办理信息。</p>
        <form id="serviceForm">
          <div class="form-step" id="studentInfoStep">
          <div class="form-row">
            <label>姓名<input name="name" autocomplete="name" required placeholder="请输入姓名" /></label>
            <label>学号（可选）<input name="studentNo" placeholder="如有请填写" /></label>
          </div>
          <label>学校<input name="schoolSearch" id="schoolSearch" autocomplete="off" required placeholder="输入学校名称的前几个字进行匹配" /><input type="hidden" name="selectedSchoolCode" id="selectedSchoolCode" /><div class="school-results" id="schoolResults"></div></label>
          <div class="form-row">
            <label>身份证号码<input name="idCard" inputmode="text" autocomplete="off" required placeholder="请输入身份证号码" /></label>
            <label>学院<select name="college" id="collegeSelect" required><option value="其他">其他学院</option></select><input id="collegeCustom" name="collegeCustom" placeholder="请输入学院名称" hidden /></label>
          </div>
          <label>手机号码<input name="phone" inputmode="tel" autocomplete="tel" required placeholder="用于联系办理信息" /></label>
          <label>地址（选填）<textarea name="address" maxlength="160" autocomplete="street-address" placeholder="如需上门或联系地址，可填写详细地址"></textarea></label>
          <label class="consent"><input name="serviceConsent" type="checkbox" required /><span>我同意将上述信息用于校园通信服务信息收集和后续联系。</span></label>
          <button class="primary-button submit-button" type="submit">提交预约</button>
          </div>
        </form>
        <p class="fulfillment-note" id="fulfillmentNote" hidden>收货地址用于号码卡配送；运营商另行提供统一线下实名认证地址和特征码。学生到店核验身份证原件后完成号码激活。</p>
      </section>
    </div>
    <div class="modal-backdrop" id="lookupModal" hidden>
      <section class="modal lookup-modal" role="dialog" aria-modal="true" aria-labelledby="lookupTitle">
        <button class="icon-close" type="button" data-close aria-label="关闭">×</button>
        <p class="eyebrow">服务进度</p>
        <h2 id="lookupTitle">查询我的服务</h2>
        <p class="modal-intro">为保护订单信息，请先验证提交预约时使用的手机号。</p>
        <form id="lookupForm">
          <label>手机号码<input name="phone" inputmode="tel" required placeholder="请输入提交预约时的手机号" /></label>
          <p class="modal-intro">请输入提交信息时填写的手机号，系统将查询该手机号对应的收集记录。</p>
          <button class="primary-button" type="submit">查询进度</button>
        </form>
        <div class="lookup-results" id="lookupResults" aria-live="polite"></div>
      </section>
    </div>

    <div class="modal-backdrop" id="completionModal" hidden>
      <section class="modal compact-modal" role="dialog" aria-modal="true" aria-labelledby="completionTitle">
        <button class="icon-close" type="button" data-close aria-label="关闭">×</button>
        <p class="eyebrow">服务确认</p><h2 id="completionTitle">确认服务已完成</h2>
        <p class="modal-intro" id="completionRecordId"></p>
        <form id="completionForm">
          <input type="hidden" name="recordId" />
          <label>服务评价<select name="rating"><option value="5">5 星：非常满意</option><option value="4">4 星：满意</option><option value="3">3 星：一般</option><option value="2">2 星：不满意</option><option value="1">1 星：非常不满意</option></select></label>
          <label>补充说明（可选）<textarea name="ratingComment" placeholder="可填写服务体验或待改进的问题"></textarea></label>
          <button class="primary-button" type="submit">确认完成并提交评价</button>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script src="/app.js"></script>
  </body>
</html>
